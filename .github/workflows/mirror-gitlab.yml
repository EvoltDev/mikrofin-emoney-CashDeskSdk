name: Mirror to GitLab

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Check runner dependencies and GitLab connectivity without copying data
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gitlab-mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.GITLAB_MIRROR_ENABLED == 'true' }}
    runs-on: [self-hosted, Linux, X64, mikrofin-builder]
    timeout-minutes: 30
    env:
      SOURCE_URL: https://github.com/${{ github.repository }}.git
      MIRROR_URL: https://mkdgitlab.mikrofin.local/e-novac/${{ github.event.repository.name }}.git
    steps:
      - name: Prepare Git LFS
        shell: bash
        env:
          GIT_LFS_VERSION: 3.8.1
          GIT_LFS_SHA256: e72cf723a4a660438862282e8aecf3885fc8123e88bfcad534cf6b941a354b75
        run: |
          set -euo pipefail
          if git lfs version >/dev/null 2>&1; then
            git lfs version
            exit 0
          fi

          tool_dir=$(mktemp -d "${RUNNER_TEMP}/git-lfs.XXXXXX")
          echo "GIT_LFS_TOOL_DIR=$tool_dir" >> "$GITHUB_ENV"
          archive="$tool_dir/git-lfs.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 10 --max-time 120 \
            --output "$archive" \
            "https://github.com/git-lfs/git-lfs/releases/download/v${GIT_LFS_VERSION}/git-lfs-linux-amd64-v${GIT_LFS_VERSION}.tar.gz"
          printf '%s  %s\n' "$GIT_LFS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" --directory "$tool_dir" --strip-components=1 \
            "git-lfs-${GIT_LFS_VERSION}/git-lfs"
          chmod +x "$tool_dir/git-lfs"
          "$tool_dir/git-lfs" version
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Check runner and GitLab connectivity
        shell: bash
        run: |
          set -euo pipefail
          git --version
          git lfs version
          status=$(curl --silent --show-error --insecure \
            --noproxy mkdgitlab.mikrofin.local \
            --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            https://mkdgitlab.mikrofin.local/users/sign_in)
          if [[ "$status" != 200 && "$status" != 302 ]]; then
            echo "::error::GitLab connectivity check returned HTTP $status"
            exit 1
          fi

      - name: Synchronize and verify all branches, tags, and LFS objects
        if: ${{ !inputs.preflight_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GITLAB_MIRROR_TOKEN" ]]; then
            echo "::error::The GITLAB_MIRROR_TOKEN repository secret is required."
            exit 1
          fi

          work_dir=$(mktemp -d "${RUNNER_TEMP}/gitlab-mirror.XXXXXX")
          trap 'rm -rf -- "$work_dir"' EXIT
          export GIT_CONFIG_GLOBAL="$work_dir/gitconfig"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_TERMINAL_PROMPT=0
          export GIT_LFS_SKIP_SMUDGE=1

          git config --global credential.helper ''
          # Expand credentials only when Git invokes each helper.
          # shellcheck disable=SC2016
          git config --global credential.https://github.com.helper \
            '!f() { test "$1" = get || exit 0; printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f'
          # shellcheck disable=SC2016
          git config --global credential.https://mkdgitlab.mikrofin.local.helper \
            '!f() { test "$1" = get || exit 0; printf "username=oauth2\npassword=%s\n" "$GITLAB_MIRROR_TOKEN"; }; f'
          git config --global http.https://mkdgitlab.mikrofin.local/.sslVerify false

          git clone --bare "$SOURCE_URL" "$work_dir/source.git"
          cd "$work_dir/source.git"
          git remote add gitlab "$MIRROR_URL"
          git lfs fetch --all origin
          git lfs push --all gitlab
          git push --atomic --prune gitlab \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

          git for-each-ref --format='%(objectname)%09%(refname)' refs/heads refs/tags \
            | LC_ALL=C sort > "$work_dir/source-refs"
          git ls-remote --refs gitlab 'refs/heads/*' 'refs/tags/*' \
            | LC_ALL=C sort > "$work_dir/destination-refs"
          diff -u "$work_dir/source-refs" "$work_dir/destination-refs"

          if [[ -n "$(git lfs ls-files --all --long)" ]]; then
            git clone --bare "$MIRROR_URL" "$work_dir/verify.git"
            git -C "$work_dir/verify.git" lfs fetch --all origin
          fi

          printf 'Verified all branches, tags, and LFS objects against GitHub.\n' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary Git LFS binary
        if: ${{ always() && env.GIT_LFS_TOOL_DIR != '' }}
        shell: bash
        run: rm -rf -- "$GIT_LFS_TOOL_DIR"
